<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mohigul University LMS</title>
<style>
:root{--p:#4f46e5;--p2:#7c3aed;--bg:#f1f2f9;--t:#1e1b3a;--m:#6b7280;--b:#e5e7eb}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Segoe UI,sans-serif;background:var(--bg);color:var(--t)}
.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#312e81,var(--p2))}
.box{background:#fff;padding:32px;border-radius:22px;width:min(380px,92vw);box-shadow:0 20px 50px #0004;text-align:center}
.logo{width:64px;height:64px;border-radius:18px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-size:32px;display:grid;place-items:center;margin:0 auto 10px}
.box h1{margin:0;font-size:22px}.box p{color:var(--m);margin:4px 0 18px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--b);border-radius:10px;font:inherit;margin-bottom:10px;background:#fff}
button{background:var(--p);color:#fff;border:0;padding:11px 18px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer}
button.g{background:#eef0ff;color:var(--p)}button.r{background:#fee2e2;color:#b91c1c;padding:6px 10px}
#app{display:none;min-height:100vh}aside{position:fixed;inset:0 auto 0 0;width:236px;background:#1e1b3a;color:#fff;padding:20px 14px;overflow:auto}
.bl{display:flex;gap:10px;align-items:center;margin:0 6px 16px}.bl .logo{width:38px;height:38px;font-size:20px;margin:0;border-radius:11px}.bl b{font-size:15px}
aside a{display:block;padding:11px 12px;border-radius:10px;cursor:pointer;color:#c7c9e8;margin-bottom:4px}aside a.on,aside a:hover{background:var(--p);color:#fff}
#who{font-size:12px;color:#9a9cc4;margin:0 8px 14px}main{margin-left:236px;padding:26px;max-width:1100px}
.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 2px 12px #0001}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;margin-bottom:18px}
.stat{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-radius:16px;padding:18px}.stat b{font-size:32px;display:block}.stat:nth-child(2){background:linear-gradient(135deg,#0ea5e9,#2563eb)}.stat:nth-child(3){background:linear-gradient(135deg,#10b981,#059669)}.stat:nth-child(4){background:linear-gradient(135deg,#f59e0b,#ea580c)}.stat:nth-child(5){background:linear-gradient(135deg,#ec4899,#be185d)}
.course{cursor:pointer;border-left:5px solid var(--p);transition:.15s}.course:hover{transform:translateY(-2px)}
table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:10px;border-bottom:1px solid var(--b)}th{color:var(--m);font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}.tag{background:#eef0ff;color:var(--p);padding:3px 10px;border-radius:99px;font-size:12px}
.m{color:var(--m);font-size:13px}h3{margin-top:0}.bar{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}.bar span{width:130px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar i{display:block;height:14px;border-radius:7px;background:linear-gradient(90deg,var(--p),var(--p2));min-width:4px}.bar em{font-style:normal;color:var(--m);font-size:13px}
.day{margin-bottom:14px}.day h4{margin:0 0 6px;color:var(--p)}.slot{display:flex;gap:12px;padding:9px 12px;background:#f7f7fd;border-radius:10px;margin-bottom:6px;align-items:center}
@media(max-width:760px){aside{position:static;width:auto}main{margin:0;padding:14px}}
</style></head><body>
<div class="login" id="login"><form class="box" onsubmit="login(event)"><div class="logo">🎓</div><h1>Mohigul University</h1><p>Oʻquv boshqaruv tizimi</p>
<input id="u" placeholder="Login" autocapitalize="off" autocorrect="off" required><input id="p" type="password" placeholder="Parol" required><button style="width:100%">Kirish</button><p id="err" style="color:#b91c1c;margin:10px 0 0"></p></form></div>
<div id="app"><aside><div class="bl"><div class="logo">🎓</div><b>Mohigul<br>University</b></div><div id="who"></div><nav id="nav"></nav><a onclick="logout()" style="margin-top:20px">🚪 Chiqish</a></aside><main id="main"></main></div>
<script>
let T=localStorage.t,U;const $=s=>document.querySelector(s),R={admin:'Admin',teacher:"Oʻqituvchi",student:'Talaba'},D=['Yakshanba','Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba'];
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const api=async(p,m='GET',b)=>{const r=await fetch('/api/'+p,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+T},body:b&&JSON.stringify(b)});const d=await r.json();if(!r.ok){if(r.status==401)logout();alert(d.error);throw d}return d};
const val=id=>$('#'+id).value,opts=(a,k='name')=>a.map(x=>`<option value="${x.id}">${esc(x[k])}</option>`).join('');
const bars=(a,mx)=>{mx=mx||Math.max(1,...a.map(x=>x[1]));return a.map(([l,v,t])=>`<div class="bar"><span>${esc(l)}</span><i style="width:${Math.max(1,v/mx*100)*.6}%"></i><em>${t??v}</em></div>`).join('')||'<span class="m">Maʼlumot yoʻq</span>'};
const csv=(n,rows)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(c=>'"'+String(c??'').replace(/"/g,'""')+'"').join(',')).join('\n')],{type:'text/csv'}));a.download=n;a.click()};
const M={admin:[['stats','📊 Bosh sahifa'],['users','👥 Foydalanuvchilar'],['groups','🏷 Guruhlar'],['courses','📚 Fanlar'],['sched','🗓 Jadval']],teacher:[['courses','📚 Fanlarim'],['sched','🗓 Jadval']],student:[['courses','📚 Fanlarim'],['grades','📝 Baholarim'],['att','✅ Davomat'],['sched','🗓 Jadval']]};
async function login(e){e.preventDefault();const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:val('u'),password:val('p')})}),d=await r.json();if(!r.ok)return $('#err').textContent=d.error;T=d.token;localStorage.t=T;boot()}
function logout(){localStorage.removeItem('t');T=null;$('#app').style.display='none';$('#login').style.display='grid'}
async function boot(){if(!T)return;try{U=await api('me')}catch{return}$('#login').style.display='none';$('#app').style.display='block';$('#who').textContent=U.name+' · '+R[U.role];
$('#nav').innerHTML=M[U.role].concat([['pw','🔑 Parol']]).map(([k,l])=>`<a id="n-${k}" onclick="go('${k}')">${l}</a>`).join('');go(M[U.role][0][0])}
function go(k){document.querySelectorAll('aside a').forEach(a=>a.classList.toggle('on',a.id=='n-'+k));V[k]()}
const V={
pw(){$('#main').innerHTML=`<h2>Parolni oʻzgartirish</h2><div class="card"><input id="po" type="password" placeholder="Eski parol"><input id="pn" type="password" placeholder="Yangi parol"><button onclick="chPw()">Saqlash</button></div>`},
async stats(){const s=await api('stats');$('#main').innerHTML=`<h2>Bosh sahifa</h2><div class="grid">${[['Talabalar',s.students],['Oʻqituvchilar',s.teachers],['Fanlar',s.courses],['Guruhlar',s.groups],['Oʻrtacha ball',s.avg??'—']].map(([a,b])=>`<div class="stat"><b>${b}</b>${a}</div>`).join('')}</div><div class="card"><h3>📈 Fanlar boʻyicha talabalar</h3>${bars(s.per.map(x=>[x.name,x.n]))}</div>`},
async users(){const[u,g]=await Promise.all([api('users'),api('groups')]);window._u=u;$('#main').innerHTML=`<h2>Foydalanuvchilar</h2><div class="card"><h3>Yangi foydalanuvchi</h3><div class="row"><input id="nm" placeholder="F.I.Sh"><input id="lg" placeholder="Login" autocapitalize="off" autocorrect="off"><input id="pw" placeholder="Parol"><select id="rl"><option value="student">Talaba</option><option value="teacher">Oʻqituvchi</option><option value="admin">Admin</option></select><select id="gp"><option value="">Guruhsiz</option>${opts(g)}</select></div><button onclick="addUser()">Qoʻshish</button></div>
<div class="card" style="overflow:auto"><div class="row"><input id="qs" placeholder="🔍 Qidirish (ism, login, guruh)" oninput="ulist()"><button class="g" style="flex:none" onclick="csv('foydalanuvchilar.csv',[['F.I.Sh','Login','Rol','Guruh'],..._u.map(x=>[x.name,x.username,R[x.role],x.gname])])">⬇ Excel (CSV)</button></div><table id="ut"></table></div>`;ulist()},
async groups(){const g=await api('groups');$('#main').innerHTML=`<h2>Guruhlar</h2><div class="card"><div class="row"><input id="gn" placeholder="Guruh nomi (masalan: IT-21)"><button style="flex:none" onclick="act('groups','POST',{name:val('gn')},V.groups)">Yaratish</button></div></div><div class="grid">${g.map(x=>`<div class="card"><h3>${esc(x.name)}</h3><div class="m">👥 ${x.n} talaba</div><button class="r" style="margin-top:10px" onclick="del('groups/${x.id}','groups')">Oʻchirish</button></div>`).join('')}</div>`},
async courses(){const c=await api('courses');let f='';if(U.role=='admin'){const t=(await api('users')).filter(x=>x.role=='teacher');f=`<div class="card"><h3>Yangi fan</h3><div class="row"><input id="cn" placeholder="Fan nomi"><select id="ct"><option value="">Oʻqituvchi tanlang</option>${opts(t)}</select></div><button onclick="addCourse()">Yaratish</button></div>`}
$('#main').innerHTML=`<h2>Fanlar</h2>${f}<div class="grid">${c.map(x=>`<div class="card course" onclick="openC(${x.id})"><h3>${esc(x.name)}</h3><div class="m">👨‍🏫 ${esc(x.teacher||'—')}</div><div class="m">👥 ${x.cnt} talaba</div></div>`).join('')||'<p class="m">Hozircha fan yoʻq</p>'}</div>`},
async grades(){const g=await api('grades'),by={};g.forEach(x=>(by[x.course]=by[x.course]||[]).push(x.score));const avg=g.length?(g.reduce((a,x)=>a+x.score,0)/g.length).toFixed(1):'—';
$('#main').innerHTML=`<h2>Baholarim · oʻrtacha: ${avg}</h2><div class="card"><h3>📈 Fanlar boʻyicha oʻrtacha</h3>${bars(Object.entries(by).map(([k,v])=>[k,v.reduce((a,b)=>a+b,0)/v.length]).map(([k,v])=>[k,v,v.toFixed(1)]),100)}</div><div class="card"><button class="g" onclick="csv('baholarim.csv',[['Fan','Topshiriq','Ball'],...window._g.map(x=>[x.course,x.title,x.score])])">⬇ Excel (CSV)</button><table><tr><th>Fan</th><th>Topshiriq</th><th>Ball</th></tr>${g.map(x=>`<tr><td>${esc(x.course)}</td><td>${esc(x.title)}</td><td><b>${x.score}</b></td></tr>`).join('')||'<tr><td class="m">Baho yoʻq</td></tr>'}</table></div>`;window._g=g},
async att(){const a=await api('myatt');$('#main').innerHTML=`<h2>Davomat</h2><div class="card">${bars(a.map(x=>[x.course,x.p/x.n*100,`${x.p}/${x.n} · ${Math.round(x.p/x.n*100)}%`]),100)}</div>`},
async sched(){const s=await api('sched');let f='';if(U.role=='admin'){const c=await api('courses');f=`<div class="card"><h3>Yangi dars</h3><div class="row"><select id="sc">${opts(c)}</select><select id="sd">${[1,2,3,4,5,6,0].map(i=>`<option value="${i}">${D[i]}</option>`).join('')}</select><input id="st" type="time"><input id="sr" placeholder="Xona"></div><button onclick="act('sched','POST',{course_id:val('sc'),dow:val('sd'),time:val('st'),room:val('sr')},V.sched)">Qoʻshish</button></div>`}
$('#main').innerHTML=`<h2>Dars jadvali</h2>${f}<div class="card">${[1,2,3,4,5,6,0].map(d=>{const x=s.filter(z=>z.dow==d);return x.length?`<div class="day"><h4>${D[d]}</h4>${x.map(z=>`<div class="slot"><b>${z.time}</b><span>${esc(z.course)}</span><span class="m">${esc(z.room)}</span>${U.role=='admin'?`<button class="r" style="margin-left:auto" onclick="del('sched/${z.id}','sched')">✕</button>`:''}</div>`).join('')}</div>`:''}).join('')||'<span class="m">Jadval boʻsh</span>'}</div>`}};
function ulist(){const k=val('qs').toLowerCase();$('#ut').innerHTML='<tr><th>F.I.Sh</th><th>Login</th><th>Rol</th><th>Guruh</th><th></th></tr>'+_u.filter(x=>[x.name,x.username,x.gname].join(' ').toLowerCase().includes(k)).map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.username)}</td><td><span class="tag">${R[x.role]}</span></td><td>${esc(x.gname||'—')}</td><td><button class="r" onclick="del('users/${x.id}','users')">✕</button></td></tr>`).join('')}
async function openC(id){const d=await api('courses/'+id),staff=U.role!='student';let h=`<a class="m" style="cursor:pointer" onclick="go('courses')">← Fanlar</a><h2>${esc(d.course.name)}</h2>`;
if(U.role=='admin'){const[u,g]=await Promise.all([api('users'),api('groups')]);h+=`<div class="card"><h3>Talabalar (${d.students.length})</h3><div class="row"><select id="es">${opts(u.filter(x=>x.role=='student'))}</select><button class="g" onclick="act('enroll','POST',{course_id:${id},student_id:val('es')},()=>openC(${id}))">Talaba qoʻshish</button></div><div class="row"><select id="eg">${opts(g)}</select><button class="g" onclick="act('enroll-group','POST',{course_id:${id},grp:val('eg')},()=>openC(${id}))">Butun guruhni qoʻshish</button></div>${d.students.map(x=>`<div style="padding:6px 0">${esc(x.name)} <button class="r" onclick="act('enroll','DELETE',{course_id:${id},student_id:${x.id}},()=>openC(${id}))">✕</button></div>`).join('')}</div>`}
if(staff){h+=`<div class="card"><h3>✅ Davomat</h3><input id="ad" type="date" value="${new Date().toISOString().slice(0,10)}" onchange="loadAtt(${id})"><div id="al"></div><button onclick="saveAtt(${id})">Davomatni saqlash</button></div>
<div class="card"><h3>Baho qoʻyish</h3><div class="row"><select id="gs">${opts(d.students)}</select><input id="gt" placeholder="Topshiriq nomi"><input id="gv" type="number" placeholder="Ball"></div><button onclick="act('grades','POST',{course_id:${id},student_id:val('gs'),title:val('gt'),score:val('gv')},()=>openC(${id}))">Saqlash</button></div>
<div class="card"><h3>E'lon / material</h3><input id="pt" placeholder="Sarlavha"><textarea id="pb" rows="3" placeholder="Matn"></textarea><button onclick="act('posts','POST',{course_id:${id},title:val('pt'),body:val('pb')},()=>openC(${id}))">E'lon qilish</button><hr style="border:0;border-top:1px solid var(--b);margin:16px 0"><input id="fl" type="file"><button class="g" onclick="upl(${id})">📎 Fayl yuklash (5MB gacha)</button></div>`}
h+=`<div class="card"><h3>📎 Fayllar</h3>${d.files.map(f=>`<div style="padding:6px 0"><a style="color:var(--p);cursor:pointer" onclick="dl(${f.id},'${esc(f.name).replace(/'/g,'')}')">⬇ ${esc(f.name)}</a> <span class="m">${f.created}</span></div>`).join('')||'<span class="m">Fayl yoʻq</span>'}</div>
<div class="card"><h3>Baholar</h3>${staff?`<button class="g" onclick="csv('baholar.csv',[['Talaba','Topshiriq','Ball'],...window._cg.map(g=>[g.student,g.title,g.score])])">⬇ Excel (CSV)</button>`:''}<table>${d.grades.map(g=>`<tr>${staff?`<td>${esc(g.student)}</td>`:''}<td>${esc(g.title)}</td><td><b>${g.score}</b></td>${staff?`<td><button class="r" onclick="act('grades/${g.id}','DELETE',null,()=>openC(${id}))">✕</button></td>`:''}</tr>`).join('')||'<tr><td class="m">Baho yoʻq</td></tr>'}</table></div>
<div class="card"><h3>E'lonlar</h3>${d.posts.map(p=>`<div style="margin-bottom:14px"><b>${esc(p.title)}</b> <span class="m">${p.created}</span><div>${esc(p.body)}</div></div>`).join('')||'<span class="m">E\'lon yoʻq</span>'}</div>`;window._cg=d.grades;$('#main').innerHTML=h;if(staff)loadAtt(id)}
async function loadAtt(id){const a=await api(`att/${id}?day=${val('ad')}`);$('#al').innerHTML=a.map(s=>`<label style="display:block;padding:7px 0"><input type="checkbox" style="width:auto;margin:0 10px 0 0" data-s="${s.id}" ${s.present!==0?'checked':''}>${esc(s.name)}</label>`).join('')||'<span class="m">Talaba yoʻq</span>'}
const saveAtt=id=>act('att','POST',{course_id:id,day:val('ad'),marks:[...document.querySelectorAll('#al input')].map(i=>[+i.dataset.s,i.checked?1:0])},()=>alert('Davomat saqlandi'));
function upl(id){const f=$('#fl').files[0];if(!f||f.size>5e6)return alert('Fayl tanlang (5MB dan kichik)');const r=new FileReader();r.onload=()=>act('files','POST',{course_id:id,name:f.name,data:r.result.split(',')[1]},()=>openC(id));r.readAsDataURL(f)}
async function dl(id,n){const r=await fetch('/api/files/'+id,{headers:{Authorization:'Bearer '+T}});const a=document.createElement('a');a.href=URL.createObjectURL(await r.blob());a.download=n;a.click()}
const act=async(p,m,b,after)=>{await api(p,m,b);after()};
const del=(p,v)=>confirm('Oʻchirilsinmi?')&&act(p,'DELETE',null,V[v]);
const chPw=()=>act('password','POST',{old:val('po'),new:val('pn')},()=>{alert('Parol saqlandi');V.pw()});
const addUser=()=>act('users','POST',{name:val('nm'),username:val('lg'),password:val('pw'),role:val('rl'),grp:val('gp')},V.users);
const addCourse=()=>act('courses','POST',{name:val('cn'),teacher_id:val('ct')},V.courses);
boot();
</script></body></html>
